name: E2E

# Work branches only: the suite builds the site against scripts/mock-api.mjs, so
# it needs none of the deploy secrets and can run wherever a push lands -- but a
# push to main is a merge of a branch this already ran on, and main's own job is
# to publish.
on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # contents: write is for pushing the captures to refs/contact-sheet/*; nothing
  # here writes to a branch, a tag or a release
  contents: write
  packages: read
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          # @miyamo2/astro-loader-blogapi-miyamo-today is on GitHub Packages (see .npmrc)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install

      - name: Install playwright and chromium
        run: bun run e2e:setup

      - name: Run e2e tests
        id: e2e
        run: bun run e2e

      # kept whether the run passed or failed: the captures are the point, and a
      # failure's trace/video is what makes it diagnosable without a local repro
      - name: Upload captures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-captures
          path: e2e/captures
          if-no-files-found: warn
          retention-days: 14

      - name: Upload playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 14

      # pinact pins every action to a commit sha, and a sha names no release, so
      # contact-sheet is built from source rather than fetched as a binary --
      # which wants a go toolchain the step can find
      - name: Setup Go
        if: ${{ always() }}
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          # nothing here is a go module, so there is no go.sum to key a cache on
          cache: false

      # an artifact is a zip behind a login, so it cannot be shown in a review;
      # this puts the same screenshots in a comment on the pull request the push
      # belongs to, and does nothing when the branch has no pull request. The
      # captures ride on refs/contact-sheet/*, outside the default fetch refspec,
      # so no clone or pull of this repository carries a screenshot.
      - name: Comment the captures on the pull request
        if: ${{ always() }}
        uses: miyamo2/contact-sheet@b0baf9daca997c6df0d8280e09ca1d6e286f6d65 # v0.1.1
        with:
          path: e2e/captures
          status: ${{ steps.e2e.outcome }}
          title: 📸 E2E captures
          row-label: screen
          template-files: .github/e2e-captures.tmpl
          # captures/<project>/<screen>-<theme>.png -- the modals and the article
          # sidebar carry no theme suffix, and the template puts those in the
          # light column, which is what they are
          layout: '^(?:[^/]+/)?(?P<screen>.+?)(?:-(?P<theme>light|dark))?\.png$'
