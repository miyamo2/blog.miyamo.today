name: E2E

# Pull requests, and nothing else: the suite builds the site against
# scripts/mock-api.mjs, so it needs none of the deploy secrets and a fork's
# pull request can run it as safely as a branch of this repository -- this job
# writes nothing, and the token it holds on a fork's is read-only anyway. A push
# to main is a merge of a pull request this already ran on, and main's own job
# is to publish. A branch with no pull request open yet is workflow_dispatch.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  # refs/pull/<n>/merge for a pull request, the branch for a dispatch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # This half runs the tests and writes nothing: the captures are published by
  # the Contact Sheet workflow, which holds the token this one does without.
  # packages: read is for the @miyamo2 package on GitHub Packages.
  contents: read
  packages: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          # @miyamo2/astro-loader-blogapi-miyamo-today is on GitHub Packages (see .npmrc)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install

      - name: Install playwright and chromium
        run: bun run e2e:setup

      - name: Run e2e tests
        run: bun run e2e

      # kept whether the run passed or failed: the captures are the point, and a
      # failure's trace/video is what makes it diagnosable without a local repro.
      # This artifact is also the whole of what crosses to the Contact Sheet
      # workflow, so its name is a contract with .github/workflows/contact-sheet.yaml
      - name: Upload captures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-captures
          path: e2e/captures
          if-no-files-found: warn
          retention-days: 14

      - name: Upload playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: warn
          retention-days: 14
