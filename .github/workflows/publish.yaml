name: Publish

on:
  push:
    branches: [main]
  repository_dispatch:
    types:
      - sync-read-model
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions: write-all

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - "6333:6333"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: latest

      - name: Install dependencies
        env:
          # @miyamo2/astro-loader-blogapi-miyamo-today is on GitHub Packages (see .npmrc)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun install

      - name: Set up aws cli
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1
          mask-aws-account-id: true

      - name: Auth blog miyamo today
        id: auth-blog-miyamo-today
        run: |
          ID_TOKEN=$(aws cognito-idp admin-initiate-auth --user-pool-id ${{ secrets.USER_POOL_ID }} --client-id ${{ secrets.USER_POOL_CLIENT_ID }} --auth-flow "ADMIN_USER_PASSWORD_AUTH" --auth-parameters USERNAME=${{ secrets.COGNITO_USER_NAME }},PASSWORD=${{ secrets.COGNITO_PASSWORD }} --query "AuthenticationResult.IdToken" | sed 's/"//g' | sed '/^$/d')
          echo "::add-mask::$ID_TOKEN"
          echo "idtoken=${ID_TOKEN}" >> $GITHUB_OUTPUT

      - name: Restore Astro cache
        id: cache-primes-restore
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        if: ${{ github.event.action ==  'sync-read-model' }}
        with:
          path: |
            ./.cache
            ./src/content/blogapi
            ./src/assets/blogapi
          key: ${{ runner.os }}-astro-build-${{ github.sha }}-${{ github.event.client_payload.event_id }}
          restore-keys: |
            ${{ runner.os }}-astro-build-${{ github.sha }}-

      - name: Build
        env:
          BLOG_API_MIYAMO_TODAY_URL: ${{ secrets.BLOG_API_MIYAMO_TODAY_URL }}
          BLOG_API_MIYAMO_TODAY_TOKEN: ${{ steps.auth-blog-miyamo-today.outputs.idtoken }}
          GITHUB_API_TOKEN: ${{ secrets.READ_MY_REPO }}
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          PUBLIC_ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.ALGOLIA_SEARCH_KEY }}
          PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: bun run build

      - name: Save Astro cache
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            ./.cache
            ./src/content/blogapi
            ./src/assets/blogapi
          key: ${{ runner.os }}-astro-build-${{ github.sha }}-${{ github.event.client_payload.event_id }}

      - name: Deploy
        env:
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: |
          # immutable hashed assets first so pages never reference missing files
          aws s3 sync ./dist/_astro "s3://${BUCKET_NAME}/_astro" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ./dist/fonts "s3://${BUCKET_NAME}/fonts" --delete --exclude "*" --include "*.woff2" \
            --content-type "font/woff2" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync ./dist/fonts "s3://${BUCKET_NAME}/fonts" --exclude "*.woff2" \
            --cache-control "public, max-age=31536000, immutable"
          # everything else must revalidate (same policy as the previous gatsby-plugin-s3 config)
          aws s3 sync ./dist "s3://${BUCKET_NAME}" --delete \
            --exclude "_astro/*" --exclude "fonts/*" --exclude "feed/rss.xml" --exclude "manifest.webmanifest" \
            --cache-control "public, max-age=0, must-revalidate"
          aws s3 cp ./dist/feed/rss.xml "s3://${BUCKET_NAME}/feed/rss.xml" \
            --content-type "application/rss+xml; charset=utf-8" --cache-control "public, max-age=0, must-revalidate"
          aws s3 cp ./dist/manifest.webmanifest "s3://${BUCKET_NAME}/manifest.webmanifest" \
            --content-type "application/manifest+json" --cache-control "public, max-age=0, must-revalidate"

      - name: Invalidate CloudFront Edge Cache
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
