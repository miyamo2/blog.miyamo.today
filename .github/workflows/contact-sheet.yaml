name: Contact Sheet

# The write half of E2E: it takes the captures that workflow left in an artifact
# and puts them in a comment on the pull request the tested commit belongs to.
#
# Why it is a second file rather than a step at the end of E2E: a workflow_run
# job is always the default branch's, whatever branch was tested, so the token
# that pushes the ref and writes the comment never runs in the same job as the
# code that produced the images. The only thing crossing between them is the
# artifact. https://github.com/miyamo2/contact-sheet#recommended--two-workflows
#
# GitHub only ever runs main's copy of this file, so a change to it -- or to the
# template it renders -- takes effect once merged, not on the branch making it.
on:
  workflow_run:
    workflows:
      - E2E
    types:
      - completed

concurrency:
  # a branch's newest sheet is the one worth having; an older one still being
  # published would only overwrite the comment with staler images. The fork is
  # part of the key because two of them may push the same branch name
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  # actions: read is for the triggering run's artifact, contents: write pushes
  # the captures to refs/contact-sheet/*, and pull-requests: write is the comment
  actions: read
  contents: write
  pull-requests: write

jobs:
  comment:
    # a cancelled run uploaded nothing -- E2E cancels itself on the next push
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      # the default branch, never the tested one: this job holds a write token,
      # and all it wants from the repository is the comment template
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: .github/e2e-captures.tmpl
          sparse-checkout-cone-mode: false

      # this is the whole of what the tested branch hands over. A run that died
      # before the upload leaves no artifact at all, and "no captures" is a state
      # the comment renders, so a missing one must not fail the job
      - name: Download the captures
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-captures
          path: captures
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # pinact pins every action to a commit sha, and a sha names no release, so
      # contact-sheet is built from source rather than fetched as a binary --
      # which wants a go toolchain the step can find
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          # nothing here is a go module, so there is no go.sum to key a cache on
          cache: false

      # an artifact is a zip behind a login, so it cannot be shown in a review;
      # this puts the same screenshots in a comment, and does nothing when the
      # tested commit belongs to no pull request. They ride on
      # refs/contact-sheet/*, outside the default fetch refspec, so no clone or
      # pull of this repository carries a screenshot
      - name: Comment the captures on the pull request
        uses: miyamo2/contact-sheet@b0baf9daca997c6df0d8280e09ca1d6e286f6d65 # v0.1.1
        with:
          path: captures
          # the job stands on the default branch, so GITHUB_SHA is not the commit
          # under review and the pull request has to be resolved from this one
          sha: ${{ github.event.workflow_run.head_sha }}
          status: ${{ github.event.workflow_run.conclusion }}
          title: 📸 E2E captures
          row-label: screen
          template-files: .github/e2e-captures.tmpl
          # <project>/<screen>-<theme>.png -- the modals and the article sidebar
          # carry no theme suffix, and the template puts those in the light
          # column, which is what they are
          layout: '^(?:[^/]+/)?(?P<screen>.+?)(?:-(?P<theme>light|dark))?\.png$'
          # safe here and only here: this job runs none of the pull request's
          # code, so the fork case is a comment written from the base repository
          allow-fork: 'true'
